[package]
name = "projects"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
aws-credential-types = "1.3.0"
aws-sigv4 = "1.5.1"
aws-smithy-runtime-api = "1.13.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "time", "uuid"] }
tracing = "0.1.44"
uuid = { version = "1.23.5", features = ["v4"] }
